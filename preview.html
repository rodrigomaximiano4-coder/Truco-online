<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Truco Online • Preview Mobile</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#17120d;color:#fff;font-family:Arial,sans-serif}
body{min-height:100svh;display:flex;align-items:center;justify-content:center;padding:18px}
.phone{width:min(390px,100%);min-height:844px;background:linear-gradient(#1d130b,#070503);border-radius:28px;overflow:hidden;box-shadow:0 20px 60px #0008;border:1px solid #61411f;position:relative}
.hero{height:560px;background:
radial-gradient(circle at 50% 26%,#6a3d15 0 12%,transparent 13%),
linear-gradient(180deg,#6b3f1b 0 16%,#2c1c10 36%,#0c0a07 100%);
position:relative;padding:14px}
.top{display:flex;justify-content:space-between;align-items:flex-start}
.badge,.coins{background:#0a0807d9;border:1px solid #b57d2a;border-radius:16px;padding:8px 10px;font-weight:800}
.logo{text-align:center;margin-top:42px;font-size:54px;font-weight:1000;line-height:.86;color:#f5c24a;text-shadow:0 3px 0 #60330f,0 7px 18px #000}
.logo small{display:block;color:#fff;font-size:24px;letter-spacing:2px;margin-top:12px}
.logo em{display:block;background:#a82318;color:#ffd96b;width:max-content;margin:10px auto 0;padding:7px 18px;border-radius:8px;font-style:normal;font-size:16px}
.main{position:absolute;left:8%;right:8%;bottom:82px;display:grid;gap:10px}
.btn{border:0;border-radius:14px;padding:14px;font-size:18px;font-weight:900;color:#fff}
.play{background:linear-gradient(#3bc73a,#187c19);border:2px solid #d9f1a0}
.google{background:linear-gradient(#3494ff,#195dba);border:2px solid #d8e8ff}
.nav{position:absolute;left:3%;right:3%;bottom:12px;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.nav button{background:#24150c;color:#ffe1a2;border:1px solid #80531f;border-radius:12px;padding:10px 4px;font-size:10px;font-weight:800}
.info{padding:16px;text-align:center}
.info h2{margin:0 0 8px;font-size:20px;color:#f4c356}
.info p{margin:0;opacity:.78;font-size:13px;line-height:1.35}
.note{margin-top:12px;font-size:11px;opacity:.55}
</style>
</head>
<body>
<div class="phone">
  <div class="hero">
    <div class="top">
      <div class="badge">🤠 Visitante<br><small>ID: TR-PREVIEW</small></div>
      <div class="coins">🪙 500</div>
    </div>
    <div class="logo">TRUCO<small>ONLINE</small><em>MAX HEALMS</em></div>
    <div class="main">
      <button class="btn play">🎴 JOGAR AGORA</button>
      <button class="btn google">G&nbsp; VINCULAR COM GOOGLE</button>
    </div>
    <div class="nav">
      <button>🛒<br>LOJA</button>
      <button>👤<br>CONTA</button>
      <button>⚙️<br>CONFIG.</button>
      <button>🏆<br>RANKING</button>
    </div>
  </div>
  <div class="info">
    <h2>Preview Mobile</h2>
    <p>Esta página existe para validar o layout no celular antes de gerar outro APK.</p>
    <div class="note">Depois de aprovarmos o formato, substituímos este preview pela versão completa.</div>
  </div>
</div>
</body>
</html>
