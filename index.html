<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070503">
<title>Truco Online • MAX HEALMS</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#050403;color:#fff;font-family:Arial,sans-serif}
button{font:inherit}#app{min-height:100svh}.hide{display:none!important}

/* MENU */
.menu{position:fixed;inset:0;overflow:hidden;background:#070503}
.menuArt{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center center}
.menuShade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.02) 0 68%,rgba(5,3,2,.65) 78%,#050403 100%)}
.hud{position:absolute;z-index:5;left:9px;right:9px;top:max(8px,env(safe-area-inset-top));display:flex;justify-content:space-between;gap:8px}
.pill{background:#080604ee;border:1px solid #a8782f;border-radius:15px;padding:8px 10px;font-weight:900;box-shadow:0 4px 14px #0009}
.player{font-size:clamp(11px,3.2vw,15px)}.player small{font-size:.72em;opacity:.8}.coins{color:#ffd766;font-size:clamp(13px,3.6vw,17px)}
.hot{position:absolute;z-index:7;border:0;background:transparent;opacity:.001}
.playHot{left:1%;width:98%;top:49.5%;height:13%}.googleHot{left:1%;width:98%;top:62.2%;height:11%}
.bottomMask{position:absolute;z-index:4;left:0;right:0;bottom:0;height:27%;background:linear-gradient(180deg,transparent,rgba(5,3,2,.83) 34%,#050403 75%)}
.nav{position:absolute;z-index:8;left:7px;right:7px;bottom:max(7px,env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.nav button{min-height:76px;border:1px solid #8e6027;border-radius:15px;background:linear-gradient(#2b180e,#100a06);color:#ffe0a2;font-weight:900;font-size:10px;padding:6px 3px;line-height:1.08;box-shadow:0 5px 14px #0009}
.nav span{display:block;font-size:23px;margin-bottom:4px}.nav small{display:block;font-size:7px;opacity:.7;margin-top:3px}

/* SHARED */
.screen{min-height:100svh;background:radial-gradient(circle at 50% -10%,#5b371536,transparent 38%),linear-gradient(#100c08,#050403);padding:max(9px,env(safe-area-inset-top)) 8px max(16px,env(safe-area-inset-bottom));overflow-x:hidden}
.top{position:sticky;top:0;z-index:20;display:grid;grid-template-columns:1fr auto auto;gap:7px;align-items:center;padding:4px 0 10px;background:linear-gradient(#100c08 78%,transparent)}
.profile{display:flex;gap:7px;align-items:center;background:#171009;border:1px solid #956526;border-radius:15px;padding:7px 9px;min-width:0}.avatar{font-size:25px}.profile b{font-size:14px}.profile small{font-size:9px;opacity:.65}
.coinBadge{background:#151009;border:1px solid #b47a24;border-radius:999px;padding:9px 10px;color:#ffd765;font-weight:900;white-space:nowrap}
.back{border:0;border-radius:12px;background:linear-gradient(#f6cb5a,#c99222);color:#1a1008;font-weight:1000;padding:10px 11px}

/* LOBBY */
.hero{border:1px solid #7c5923;border-radius:20px;padding:15px 14px;margin:7px 0 10px;text-align:center;background:radial-gradient(circle at 75% 0,#e4b83b1d,transparent 35%),linear-gradient(145deg,#142c1e,#151008)}
.hero .ey{font-size:10px;letter-spacing:2px;color:#e9bd4a;font-weight:900}.hero h2{margin:5px 0 3px;font-size:22px}.hero p{margin:0;font-size:11px;opacity:.65}
.tables{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
.table{position:relative;min-height:183px;border:1px solid #8a5d22;border-radius:17px;padding:10px;text-align:left;color:#fff;background:radial-gradient(circle at 80% 0,#f0ca6412,transparent 30%),linear-gradient(155deg,#28190f,#0c0906 68%);box-shadow:0 7px 18px #0008}
.table:disabled{opacity:.38;filter:grayscale(.65)}.tableHead{display:flex;gap:6px;align-items:center;font-weight:1000;font-size:13px}.tableHead i{font-style:normal;font-size:22px}
.felt{height:65px;border-radius:50%/37%;margin:8px 0 6px;border:5px solid #4a2a12;background:radial-gradient(circle,#226b48,#123f2a);display:grid;place-items:center;box-shadow:inset 0 0 15px #0009,0 4px 10px #0008}.felt span{font-size:29px}
.sub{font-size:10px;opacity:.58}.price{font-size:12px;margin-top:5px}.status{font-size:9px;font-weight:1000;color:#5ce58a;margin-top:7px}.tap{display:block;color:#ffcf42;margin-top:3px}.locked{color:#a89e90}

/* GAME */
.gameTop{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;margin-bottom:6px}.gameTop .stake{text-align:center;font-size:12px}.exit{justify-self:end;background:#d74738;color:#fff;border:0;border-radius:13px;padding:10px 14px;font-weight:900}
.score{display:flex;justify-content:space-between;align-items:center;font-size:12px;margin:4px 2px 7px}.score b{font-size:14px}
.board{height:min(56svh,485px);min-height:420px;border:3px solid #5a3517;border-radius:19px;background:radial-gradient(circle at center,#1b7248,#105433);display:grid;grid-template-columns:62px 1fr 62px;grid-template-rows:77px 1fr 105px;gap:3px;padding:6px;box-shadow:inset 0 0 32px #0008}
.seat{text-align:center;font-size:11px}.seat.topSeat{grid-column:1/4}.seat.left{grid-column:1;grid-row:2}.seat.right{grid-column:3;grid-row:2}.center{grid-column:2;grid-row:2;border:6px solid #4b2b12;border-radius:28px;display:grid;place-items:center;background:radial-gradient(#1a6a45,#103e2a);box-shadow:inset 0 0 22px #000a}
.me{grid-column:1/4;grid-row:3;text-align:center;align-self:end}.hand{display:flex;justify-content:center;gap:6px;margin-top:4px}
.backCard{display:inline-block;width:22px;height:32px;border:1px solid #fff;border-radius:5px;background:repeating-linear-gradient(45deg,#7a1f1f,#7a1f1f 4px,#a33 4px,#a33 8px);margin:1px}.me .backCard{width:0}
.card{width:52px;height:74px;border-radius:7px;background:#fffdf7;color:#111;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;font-size:22px;font-weight:900;border:1px solid #aaa}.red{color:#bd342c}
.vira{text-align:center;font-size:11px}.vira .card{width:46px;height:65px;font-size:20px;margin-top:4px}
.msg{text-align:center;color:#f2c549;font-size:12px;font-weight:900;margin:8px 0 6px;min-height:18px}.actions{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}.truco{background:linear-gradient(#ffd059,#e8aa20);border:0;border-radius:15px;padding:12px 18px;font-weight:1000;color:#201306;font-size:18px}.reactOpen{background:linear-gradient(#28170e,#120a06);border:1px solid #9a6928;border-radius:999px;padding:12px 25px;color:#f6d59b;font-weight:900}
.reactPanel{display:none;margin:9px auto 0;padding:8px;border:1px solid #6d491f;border-radius:16px;background:#0d0907;max-height:31svh;overflow:auto}.reactPanel.open{display:block}.reactGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.react{min-height:55px;border:1px solid #70491f;border-radius:11px;background:#211108;color:#fff;font-size:22px}
@media(max-width:370px){.tables{grid-template-columns:1fr}.board{grid-template-columns:54px 1fr 54px}.reactGrid{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body><div id="app"></div>
<script>
const app=document.getElementById('app');let coins=5000;
const tables=[
[500,'Mesa Bronze','🥉','Entrada rápida'],
[1000,'Mesa Prata','🥈','Mesa intermediária'],
[2000,'Mesa Ouro','🥇','A disputa esquenta'],
[5000,'Mesa Safira','💎','Mesa premium'],
[10000,'Mesa Rubi','♦️','Apostas altas'],
[20000,'Mesa Real','👑','Só para os fortes'],
[50000,'Mesa Lenda','🔥','A mesa máxima']
];
function menu(){app.innerHTML=`<div class="menu">
<img class="menuArt" src="menu.webp" alt="Menu oficial Truco Online MAX HEALMS">
<div class="menuShade"></div>
<div class="hud"><div class="pill player">🤠 Capitão Ladrão<br><small>ID: TR-PREVIEW</small></div><div class="pill coins">🪙 ${coins.toLocaleString('pt-BR')}</div></div>
<button class="hot playHot" onclick="lobby()" aria-label="Jogar agora"></button>
<button class="hot googleHot" onclick="alert('Google real será ligado no Firebase; aqui é apenas a prévia visual.')" aria-label="Google"></button>
<div class="bottomMask"></div>
<div class="nav">
<button onclick="shop()"><span>🛒</span>LOJA<small>COMPRE MOEDAS</small></button>
<button onclick="account()"><span>👤</span>CONTA E PERFIL<small>ID, APELIDO E AVATAR</small></button>
<button onclick="settings()"><span>⚙️</span>CONFIGURAÇÕES<small>SOM, GRÁFICOS, AJUDA</small></button>
<button onclick="ranking()"><span>🏆</span>RANKING<small>OS MELHORES JOGADORES</small></button>
</div></div>`}
function topbar(){return `<div class="top"><div class="profile"><div class="avatar">🤠</div><div><b>Capitão Ladrão</b><small>TR-PREVIEW</small></div></div><div class="coinBadge">🪙 ${coins.toLocaleString('pt-BR')}</div><button class="back" onclick="menu()">← MENU</button></div>`}
function lobby(){app.innerHTML=`<div class="screen">${topbar()}<div class="hero"><div class="ey">ESCOLHA SUA MESA</div><h2>Entre onde seu saldo permitir</h2><p>Um toque em qualquer mesa disponível inicia a partida.</p></div><div class="tables">${tables.map(t=>{const ok=coins>=t[0];return `<button class="table" ${ok?'onclick="game('+t[0]+')"':'disabled'}><div class="tableHead"><i>${t[2]}</i>${t[1]}</div><div class="felt"><span>🂠 🂠</span></div><div class="sub">${t[3]}</div><div class="price">Entrada 🪙 <b>${t[0].toLocaleString('pt-BR')}</b></div><div class="status ${ok?'':'locked'}">${ok?'● DISPONÍVEL<span class="tap">TOQUE PARA ENTRAR</span>':'🔒 BLOQUEADA'}</div></button>`}).join('')}</div></div>`}
function game(bet){app.innerHTML=`<div class="screen">
<div class="gameTop"><div class="coinBadge">🪙 ${coins.toLocaleString('pt-BR')}</div><div class="stake">Aposta ${bet.toLocaleString('pt-BR')}</div><button class="exit" onclick="lobby()">🚪 Sair</button></div>
<div class="score"><b>Nós 0</b><span>Mão vale <b>1</b></span><b>Eles 0</b></div>
<div class="board">
<div class="seat topSeat">👩 Ana (parceira) 🎴<br><span class="backCard"></span><span class="backCard"></span><span class="backCard"></span></div>
<div class="seat left">🤠 Carlos<br><span class="backCard"></span><br><span class="backCard"></span><br><span class="backCard"></span></div>
<div class="center"><div class="vira">Vira<br><span class="card">7<br>♣</span></div></div>
<div class="seat right">👨 Beto<br><span class="backCard"></span><br><span class="backCard"></span><br><span class="backCard"></span></div>
<div class="me">🤠 Capitão Ladrão 🎴<div class="hand"><span class="card red">4<br>♥</span><span class="card red">A<br>♦</span><span class="card">K<br>♣</span></div></div>
</div>
<div class="msg">🔄 Você deu as cartas • começa Carlos</div>
<div class="actions"><button class="truco">TRUCO! (3)</button><button class="reactOpen" onclick="toggleReact()">😈 Reações</button></div>
<div id="rp" class="reactPanel"><div class="reactGrid">${['🃏','🤥','👀','🐔','😏','🏃','😂','😉','👏','😴','🪣','💣','⚡','🍅','🥚','🧊','🌪️','👟','🧲','🎂'].map(x=>`<button class="react">${x}</button>`).join('')}</div></div>
</div>`}
function toggleReact(){document.getElementById('rp').classList.toggle('open')}
function simple(title,body){app.innerHTML=`<div class="screen">${topbar()}<div class="hero"><div class="ey">MAX HEALMS</div><h2>${title}</h2><p>${body}</p></div></div>`}
function shop(){simple('Loja','Pacotes de moedas e compras ficam aqui.')}
function account(){simple('Conta e Perfil','Nome, ID, avatar e vínculo Google.')}
function settings(){simple('Configurações','Som, vibração, gráficos e ajuda.')}
function ranking(){simple('Ranking','Melhores jogadores e estatísticas.')}
menu();
</script></body></html>
